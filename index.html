<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#3A7D2C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>MiniFazenda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',sans-serif;-webkit-tap-highlight-color:transparent}
        body{background:#FBF8F1;color:#2C1810;overflow-x:hidden}
        .app{max-width:500px;margin:0 auto;min-height:100vh;position:relative;background:#FBF8F1}
        .pag{display:none;animation:sobe .25s ease}.pag.ativo{display:block}
        @keyframes sobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes sobemodal{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 12px rgba(44,24,16,.05)}
        .bp:active{transform:scale(.95);transition:transform .1s}
        input,select,textarea{width:100%;padding:11px 14px;border:2px solid #E8E0D0;border-radius:12px;background:#F5F0E8;font-size:14px;font-family:'Nunito',sans-serif;color:#2C1810;outline:none;transition:border .2s}
        input:focus,select:focus,textarea:focus{border-color:#3A7D2C}
        .tab{border-bottom:3px solid transparent;padding:10px 0;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all .2s}
        .tab.on{color:#3A7D2C;border-bottom-color:#3A7D2C}
        .tab:not(.on){color:#8B7355}
        .nv{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;cursor:pointer;transition:color .2s;color:#8B7355;font-size:10px;font-weight:700;flex:1}
        .nv.on{color:#3A7D2C}
        .nv .pts{width:16px;height:3px;border-radius:2px;background:#3A7D2C;transform:scaleX(0);transition:transform .2s;margin-top:3px}
        .nv.on .pts{transform:scaleX(1)}
        .fab{position:fixed;z-index:30;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#3A7D2C,#4E9A3E);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(58,125,44,.35);bottom:82px;right:max(16px,calc(50% - 240px));transition:transform .15s}
        .fab:active{transform:scale(.9)}
        .esconde::-webkit-scrollbar{display:none}.esconde{-ms-overflow-style:none;scrollbar-width:none}
        .toast-box{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:90%;max-width:400px}
        .toast-item{padding:10px 20px;border-radius:14px;color:#fff;font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.15);animation:sobe .3s ease;pointer-events:auto;text-align:center;width:100%}
        .fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
        .fundo.abre{display:block}
        .modal-cima{position:fixed;bottom:0;left:0;right:0;z-index:51;background:#fff;border-radius:24px 24px 0 0;max-height:85vh;overflow-y:auto;max-width:500px;margin:0 auto;display:none;animation:sobemodal .3s ease}
        .modal-cima.abre{display:block}
        @media(max-width:500px){.fab{right:16px}}
        @media print{.fab,.nv-bar,.topo,.fundo,.modal-cima,.toast-box{display:none!important}.pag{display:block!important}body{background:#fff}.app{box-shadow:none}}
    </style>
</head>
<body>
<div class="app" id="app">

    <div class="topo" style="position:fixed;top:0;left:0;right:0;z-index:40;background:linear-gradient(135deg,#3A7D2C,#2A5C1E)">
        <div style="max-width:500px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
            <div><div style="color:#fff;font-size:18px;font-weight:900">MiniFazenda</div><div id="saudacao" style="color:#a8d89a;font-size:11px;font-weight:600"></div></div>
            <div style="display:flex;gap:8px">
                <button onclick="abrirCompras()" class="bp" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;cursor:pointer"><i class="fa-solid fa-cart-shopping" style="font-size:13px"></i></button>
                <button onclick="gerarPDF()" class="bp" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;cursor:pointer"><i class="fa-solid fa-file-pdf" style="font-size:13px"></i></button>
            </div>
        </div>
    </div>

    <div style="padding:64px 16px 90px">
        <div id="pg-inicio" class="pag ativo"></div>
        <div id="pg-rebanho" class="pag">
            <div style="display:flex;gap:0;border-bottom:2px solid #E8E0D0;margin:0 -16px 16px;padding:0 16px;overflow-x:auto" class="esconde">
                <div class="tab on" data-t="galinhas" onclick="mudarTab('galinhas')">🐔 Galinhas</div>
                <div class="tab" style="margin-left:20px" data-t="codornas" onclick="mudarTab('codornas')"> Codornas</div>
                <div class="tab" style="margin-left:20px" data-t="peixes" onclick="mudarTab('peixes')">🐟 Peixes</div>
            </div>
            <div id="reb-conteudo"></div>
        </div>
        <div id="pg-postura" class="pag"></div>
        <div id="pg-vendas" class="pag"></div>
        <div id="pg-financeiro" class="pag"></div>
        <div id="pg-racao" class="pag"></div>
        <div id="pg-dicas" class="pag"></div>
    </div>

    <button class="fab" id="fabBtn" onclick="acaoFab()"><i class="fa-solid fa-plus"></i></button>

    <div class="nv-bar" style="position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:2px solid #E8E0D0;padding-bottom:env(safe-area-inset-bottom,0px)">
        <div style="max-width:500px;margin:0 auto;display:flex">
            <div class="nv on" data-p="inicio" onclick="irPara('inicio')"><i class="fa-solid fa-house" style="font-size:18px;margin-bottom:2px"></i>Inicio<div class="pts"></div></div>
            <div class="nv" data-p="rebanho" onclick="irPara('rebanho')"><span style="font-size:18px;margin-bottom:2px">🐔</span>Rebanho<div class="pts"></div></div>
            <div class="nv" data-p="postura" onclick="irPara('postura')"><i class="fa-solid fa-egg" style="font-size:18px;margin-bottom:2px"></i>Postura<div class="pts"></div></div>
            <div class="nv" data-p="vendas" onclick="irPara('vendas')"><i class="fa-solid fa-coins" style="font-size:18px;margin-bottom:2px"></i>Vendas<div class="pts"></div></div>
            <div class="nv" onclick="abrirMenu()"><i class="fa-solid fa-ellipsis" style="font-size:18px;margin-bottom:2px"></i>Mais<div class="pts"></div></div>
        </div>
    </div>
</div>

<div class="fundo" id="fundo" onclick="fecharTudo()"></div>
<div class="modal-cima esconde" id="modal">
    <div style="position:sticky;top:0;background:#fff;border-radius:24px 24px 0 0;z-index:2;padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E8E0D0">
        <div id="modalTitulo" style="font-size:17px;font-weight:900;color:#2C1810"></div>
        <button onclick="fecharTudo()" style="width:32px;height:32px;border-radius:50%;background:#E8E0D0;border:none;cursor:pointer;color:#5C4033;font-size:14px"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="modalCorpo" style="padding:20px"></div>
</div>

<div class="toast-box" id="toasts"></div>

<script>
var CHAVE = 'mf_v6';
var D = {};

// APP COMECA ZERADO - SEM DADOS DE EXEMPLO
function dadosVazio() {
    return {
        galinhas: [],
        codornas: [],
        peixes: [],
        postura: [],
        vendas: [],
        compras: [],
        nid: {g:1, c:1, p:1, po:1, v:1, co:1}
    };
}

function carregar(){
    try{
        var r = localStorage.getItem(CHAVE);
        if (r) {
            D = JSON.parse(r);
            if (!D.nid) D.nid = dadosVazio().nid;
            // Garante que todos os arrays existem
            if (!D.galinhas) D.galinhas = [];
            if (!D.codornas) D.codornas = [];
            if (!D.peixes) D.peixes = [];
            if (!D.postura) D.postura = [];
            if (!D.vendas) D.vendas = [];
            if (!D.compras) D.compras = [];
        } else {
            D = dadosVazio();
            salvar();
        }
    } catch(e) {
        D = dadosVazio();
        salvar();
    }
}

function salvar(){try{localStorage.setItem(CHAVE, JSON.stringify(D))}catch(e){}}

// LIMPAR TUDO - remove do localStorage e recarrega zerado
function limparTudo(){
    if (!confirm('APAGAR TUDO?\n\nRebanho, postura, vendas, compras...\nTODOS os dados serao apagados!')) return;
    localStorage.removeItem(CHAVE);
    D = dadosVazio();
    salvar();
    document.getElementById('fundo').classList.remove('abre');
    document.getElementById('modal').classList.remove('abre');
    document.body.style.overflow = '';
    setTimeout(function(){
        desenhar();
        toast('Todos os dados foram apagados!');
    }, 150);
}

// EXCLUIR HISTORICO DE POSTURA
function excluirHistoricoPostura(){
    if (!confirm('Excluir TODO o historico de postura?\n\nEssa acao nao pode ser desfeita.')) return;
    D.postura = [];
    salvar();
    fecharTudo();
    desenhar();
    toast('Historico de postura excluido!', 'aviso');
}

// EXCLUIR HISTORICO DE VENDAS
function excluirHistoricoVendas(){
    if (!confirm('Excluir TODO o historico de vendas?\n\nEssa acao nao pode ser desfeita.')) return;
    D.vendas = [];
    salvar();
    fecharTudo();
    desenhar();
    toast('Historico de vendas excluido!', 'aviso');
}

function R$(n){return 'R$ ' + Number(n).toFixed(2).replace('.', ',')}
function dataBr(d){var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function hoje(){return new Date().toISOString().split('T')[0]}
function diasAtras(n){var d=new Date();d.setDate(d.getDate()-n);return d.toISOString().split('T')[0]}
function saudacao(){var h=new Date().getHours();return h<12?'Bom dia, fazendeiro!':h<18?'Boa tarde, fazendeiro!':'Boa noite, fazendeiro!'}

function toast(msg, tipo){
    tipo = tipo || 'ok';
    var cor = tipo==='ok'?'#3A7D2C':tipo==='erro'?'#dc2626':'#D4A030';
    var el = document.createElement('div');
    el.className = 'toast-item';
    el.style.background = cor;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(function(){el.remove()}, 2800);
}

function totalVendas(dias){var ini=diasAtras(dias),t=0;for(var i=0;i<D.vendas.length;i++){if(D.vendas[i].data>=ini)t+=D.vendas[i].qtd*D.vendas[i].vu}return t}
function totalCompras(dias){var ini=diasAtras(dias),t=0;for(var i=0;i<D.compras.length;i++){if(D.compras[i].data>=ini)t+=D.compras[i].qtd*D.compras[i].vu}return t}
function totalAves(tipo){var arr=tipo==='g'?D.galinhas:tipo==='c'?D.codornas:D.peixes;var t=0;for(var i=0;i<arr.length;i++)t+=arr[i].qtd;return t}

var pagAtual = 'inicio';
var tabAtual = 'galinhas';

function irPara(pg){
    pagAtual = pg;
    var pags = document.querySelectorAll('.pag');
    for(var i=0;i<pags.length;i++) pags[i].classList.remove('ativo');
    var el = document.getElementById('pg-'+pg); if(el) el.classList.add('ativo');
    var nvs = document.querySelectorAll('.nv');
    for(var i=0;i<nvs.length;i++) nvs[i].classList.remove('on');
    var nv = document.querySelector('.nv[data-p="'+pg+'"]');
    if(nv) nv.classList.add('on');
    window.scrollTo(0,0);
    desenhar();
}

function mudarTab(t){
    tabAtual = t;
    var tabs = document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++) tabs[i].classList.remove('on');
    var tb = document.querySelector('.tab[data-t="'+t+'"]');
    if(tb) tb.classList.add('on');
    desenhar();
}

function desenhar(){
    document.getElementById('saudacao').textContent = saudacao();
    switch(pagAtual){
        case 'inicio': desenharInicio(); break;
        case 'rebanho': desenharRebanho(); break;
        case 'postura': desenharPostura(); break;
        case 'vendas': desenharVendas(); break;
        case 'financeiro': desenharFinanceiro(); break;
        case 'racao': desenharRacao(); break;
        case 'dicas': desenharDicas(); break;
    }
}

// ============ INICIO ============
function desenharInicio(){
    var oh = {og:0,oc:0};
    for(var i=0;i<D.postura.length;i++){if(D.postura[i].data===hoje()){oh=D.postura[i];break}}
    var tv7=totalVendas(7),tc7=totalCompras(7),tv30=totalVendas(30),tc30=totalCompras(30);
    var l7=tv7-tc7,l30=tv30-tc30;
    var h = '<div style="margin-bottom:16px"><div style="font-size:20px;font-weight:900;color:#2C1810">'+saudacao()+'</div><div style="font-size:13px;color:#8B7355">Resumo da sua fazendinha</div></div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">';
    h += cardCli('onclick="irPara(\'rebanho\')"','<span style="font-size:24px">🐔</span>','Galinhas',''+totalAves('g')+' aves',D.galinhas.length+' lotes');
    h += cardCli('onclick="irPara(\'rebanho\');setTimeout(function(){mudarTab(\'codornas\')},100)"','<span style="font-size:24px">🐤</span>','Codornas',''+totalAves('c')+' aves',D.codornas.length+' lotes');
    h += cardCli('onclick="irPara(\'rebanho\');setTimeout(function(){mudarTab(\'peixes\')},100)"','<span style="font-size:24px">🐠</span>','Peixes',''+totalAves('p')+' peixes',D.peixes.length+' caixas');
    h += cardCli('onclick="irPara(\'postura\')"','<span style="font-size:24px">🥚</span>','Ovos Hoje',''+(oh.og+oh.oc),oh.og+' gal / '+oh.oc+' cod');
    h += '</div>';
    h += '<div class="card" style="margin-bottom:16px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><span style="font-weight:900;color:#2C1810"><i class="fa-solid fa-wallet" style="color:#3A7D2C;margin-right:8px"></i>Financeiro</span><span onclick="irPara(\'financeiro\')" style="font-size:12px;font-weight:700;color:#3A7D2C;cursor:pointer">Ver mais <i class="fa-solid fa-chevron-right" style="font-size:10px"></i></span></div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">';
    h += '<div style="text-align:center;padding:12px 8px;border-radius:14px;background:#f0f7ed"><div style="font-size:10px;font-weight:700;color:#8B7355;text-transform:uppercase;margin-bottom:4px">Semana</div><div style="font-size:16px;font-weight:900;color:'+(l7>=0?'#3A7D2C':'#dc2626')+'">'+R$(l7)+'</div></div>';
    h += '<div style="text-align:center;padding:12px 8px;border-radius:14px;background:#fef3cd"><div style="font-size:10px;font-weight:700;color:#8B7355;text-transform:uppercase;margin-bottom:4px">Mes</div><div style="font-size:16px;font-weight:900;color:'+(l30>=0?'#3A7D2C':'#dc2626')+'">'+R$(l30)+'</div></div>';
    h += '<div style="text-align:center;padding:12px 8px;border-radius:14px;background:#e0f0ff"><div style="font-size:10px;font-weight:700;color:#8B7355;text-transform:uppercase;margin-bottom:4px">Vendas 30d</div><div style="font-size:16px;font-weight:900;color:#2563eb">'+R$(tv30)+'</div></div>';
    h += '</div></div>';

    h += '<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><span style="font-weight:900;color:#2C1810"><i class="fa-solid fa-receipt" style="color:#D4A030;margin-right:8px"></i>Ultimas Vendas</span><span onclick="irPara(\'vendas\')" style="font-size:12px;font-weight:700;color:#3A7D2C;cursor:pointer">Todas <i class="fa-solid fa-chevron-right" style="font-size:10px"></i></span></div>';
    var ult = D.vendas.slice(-5).reverse();
    if (ult.length === 0) {
        h += '<div style="text-align:center;padding:20px 0;color:#8B7355;font-size:13px">Nenhuma venda registrada ainda</div>';
    } else {
        for(var i=0;i<ult.length;i++){
            var vv = ult[i];
            var ic = vv.tipo.includes('Galinha')?'fa-egg':vv.tipo.includes('Codorna')?'fa-egg':vv.tipo==='Adubo'?'fa-seedling':vv.tipo==='Peixes'?'fa-fish':'fa-dove';
            var bg = vv.tipo.includes('Galinha')?'#fff7ed':vv.tipo.includes('Codorna')?'#fefce8':vv.tipo==='Adubo'?'#fffbeb':vv.tipo==='Peixes'?'#eff6ff':'#f0f7ed';
            var cg = vv.tipo.includes('Galinha')?'#f97316':vv.tipo.includes('Codorna')?'#eab308':vv.tipo==='Adubo'?'#d97706':vv.tipo==='Peixes'?'#3b82f6':'#3A7D2C';
            h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0ebe0'+(i===ult.length-1?';border:none':'')+'"><div style="display:flex;align-items:center;gap:10px"><div style="width:32px;height:32px;border-radius:10px;background:'+bg+';display:flex;align-items:center;justify-content:center"><i class="fa-solid '+ic+'" style="font-size:12px;color:'+cg+'"></i></div><div><div style="font-size:13px;font-weight:700;color:#2C1810">'+vv.produto+'</div><div style="font-size:11px;color:#8B7355">'+dataBr(vv.data)+' · '+vv.qtd+'x</div></div></div><div style="font-size:13px;font-weight:900;color:#3A7D2C">'+R$(vv.qtd*vv.vu)+'</div></div>';
        }
    }
    h += '</div>';
    document.getElementById('pg-inicio').innerHTML = h;
}

function cardCli(onclick,emoji,titulo,valor,sub){
    return '<div class="card bp" style="cursor:pointer" '+onclick+'><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'+emoji+'<span style="font-size:11px;font-weight:700;color:#8B7355;text-transform:uppercase">'+titulo+'</span></div><div style="font-size:22px;font-weight:900;color:#2C1810">'+valor+'</div><div style="font-size:11px;color:#8B7355">'+sub+'</div></div>';
}

// ============ REBANHO ============
function desenharRebanho(){
    var arr,label,emoji;
    if(tabAtual==='galinhas'){arr=D.galinhas;label='Galinhas';emoji='🐔'}
    else if(tabAtual==='codornas'){arr=D.codornas;label='Codornas';emoji='🐤'}
    else{arr=D.peixes;label='Peixes';emoji='🐠'}
    var total=0;for(var i=0;i<arr.length;i++)total+=arr[i].qtd;
    var h = '<div style="font-size:13px;color:#8B7355;font-weight:600;margin-bottom:14px">'+arr.length+' lotes · '+total+' '+(tabAtual==='peixes'?'peixes':'aves')+'</div>';
    if(arr.length===0){
        h += '<div style="text-align:center;padding:40px 0"><i class="fa-solid fa-inbox" style="font-size:40px;color:#C4AD8C;margin-bottom:12px;display:block"></i><div style="font-weight:900;color:#8B7355;margin-bottom:4px">Nenhum '+label.toLowerCase()+'</div><div style="font-size:13px;color:#8B7355">Use o botao + para adicionar</div></div>';
    } else {
        for(var i=0;i<arr.length;i++){
            var item=arr[i];
            var dias=Math.floor((new Date()-new Date(item.data))/86400000);
            var stCor=item.status==='postura'?'background:#f0f7ed;color:#3A7D2C':item.status==='engorda'?'background:#eff6ff;color:#2563eb':'background:#fef3cd;color:#92400e';
            var nome=tabAtual==='peixes'?item.especie:item.raca;
            var local=tabAtual==='peixes'?item.caixa:item.local;
            var tipo=tabAtual==='peixes'?'p':tabAtual==='codornas'?'c':'g';
            h += '<div class="card bp" style="margin-bottom:10px"><div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px"><div><div style="font-weight:900;color:#2C1810">'+emoji+' '+nome+'</div><div style="font-size:12px;color:#8B7355">'+local+'</div></div><span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;'+stCor+'">'+item.status+'</span></div>';
            h += '<div style="display:flex;gap:16px;font-size:13px;margin-bottom:6px"><span style="font-weight:700;color:#2C1810">'+item.qtd+' '+(tabAtual==='peixes'?'peixes':'aves')+'</span><span style="color:#8B7355">'+dias+' dias</span></div>';
            if(item.obs) h += '<div style="font-size:12px;color:#8B7355;font-style:italic;margin-bottom:8px">'+item.obs+'</div>';

// --- Lote ---
function abrirFormLote(tipo,editId){
    if(!tipo)tipo=tabAtual==='peixes'?'p':tabAtual==='codornas'?'c':'g';
    var isPeixe=tipo==='p';
    var arr=isPeixe?D.peixes:tipo==='c'?D.codornas:D.galinhas;
    var ed=null;if(editId){for(var i=0;i<arr.length;i++){if(arr[i].id===editId){ed=arr[i];break}}}
    var label=isPeixe?'Peixes':tipo==='c'?'Codornas':'Galinhas';
    var h='<form onsubmit="salvarLote(event,\''+tipo+'\','+(editId||0)+')">';
    if(isPeixe){
        h+=campo('Espécie','text','especie',ed?ed.especie:'Tilápia',true);
        h+=campo('Quantidade','number','qtd',ed?String(ed.qtd):'',true);
        h+=campo('Caixa d\'água','text','caixa',ed?ed.caixa:'',true);
        h+=selCampo('Status','status',[['engorda','Engorda'],['alevinos','Alevinos'],['reproducao','Reprodução']],ed?ed.status:'engorda');
    }else{
        var racas=tipo==='c'?['Coturnix japonesa','Coturnix europeia','AMAX','Outra']:['Isa Brown','Rhode Island Red','Plymouth Rock','Leghorn','Sussex','Australorp','Wyandotte','Outra'];
        h+=selCampo('Raça','raca',racas.map(function(r){return[r,r]}),ed?ed.raca:racas[0]);
        h+=campo('Quantidade','number','qtd',ed?String(ed.qtd):'',true);
        h+=campo('Local','text','local',ed?ed.local:'',true);
        h+=selCampo('Status','status',[['postura','Postura'],['crescimento','Crescimento'],['reproducao','Reprodução']],ed?ed.status:'postura');
    }
    h+=campoDt('Data de chegada','data',ed?ed.data:hoje());
    h+=campoTx('Observações','obs',ed?ed.obs:'');
    h+='<button type="submit" class="bp" style="width:100%;padding:14px;border-radius:14px;background:#3A7D2C;border:none;color:#fff;font-size:14px;font-weight:800;cursor:pointer"><i class="fa-solid fa-check" style="margin-right:8px"></i>'+(ed?'Salvar Alterações':'Adicionar')+'</button></form>';
    abrirModal(ed?'Editar '+label:'Adicionar '+label,h);
}
function campo(l,t,n,v,r){return'<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700;color:#8B7355;text-transform:uppercase;display:block;margin-bottom:4px">'+l+'</label><input type="'+t+'" name="'+n+'" value="'+(v||'')+'" '+(r?'required':'')+'></div>'}
function campoDt(l,n,v){return'<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700;color:#8B7355;text-transform:uppercase;display:block;margin-bottom:4px">'+l+'</label><input type="date" name="'+n+'" value="'+v+'" required></div>'}
function campoTx(l,n,v){return'<div style="margin-bottom:16px"><label style="font-size:11px;font-weight:700;color:#8B7355;text-transform:uppercase;display:block;margin-bottom:4px">'+l+'</label><textarea name="'+n+'" rows="2" placeholder="Notas...">'+(v||'')+'</textarea></div>'}
function selCampo(l,n,ops,val){var h='<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700;color:#8B7355;text-transform:uppercase;display:block;margin-bottom:4px">'+l+'</label><select name="'+n+'">';for(var i=0;i<ops.length;i++){h+='<option value="'+ops[i][0]+'"'+(val===ops[i][0]?' selected':'')+'>'+ops[i][1]+'</option>'}h+='</select></div>';return h}

function salvarLote(e,tipo,editId){
    e.preventDefault();var f=e.target;
    if(tipo==='p'){var obj={especie:f.especie.value,qtd:parseInt(f.qtd.value),caixa:f.caixa.value,status:f.status.value,data:f.data.value,obs:f.obs.value};if(editId){for(var i=0;i<D.peixes.length;i++){if(D.peixes[i].id===editId){D.peixes[i].especie=obj.especie;D.peixes[i].qtd=obj.qtd;D.peixes[i].caixa=obj.caixa;D.peixes[i].status=obj.status;D.peixes[i].data=obj.data;D.peixes[i].obs=obj.obs;break}}}else{obj.id=D.nid.p++;D.peixes.push(obj)}}
    else{var obj={raca:f.raca.value,qtd:parseInt(f.qtd.value),local:f.local.value,status:f.status.value,data:f.data.value,obs:f.obs.value};var arr=tipo==='c'?D.codornas:D.galinhas;if(editId){for(var i=0;i<arr.length;i++){if(arr[i].id===editId){arr[i].raca=obj.raca;arr[i].qtd=obj.qtd;arr[i].local=obj.local;arr[i].status=obj.status;arr[i].data=obj.data;arr[i].obs=obj.obs;break}}}else{obj.id=D.nid[tipo]++;arr.push(obj)}}
    salvar();fecharTudo();toast(editId?'Lote atualizado!':'Lote adicionado!');desenhar();
}

    h+='<div style="font-weight:900;color:#2C1810;margin-bottom:10px">Últimas compras</div>';
    if(ult.length===0){h+='<div style="font-size:13px;color:#8B7355">Nenhuma compra</div>'}
    else{for(var i=0;i<ult.length;i++){var c=ult[i];h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0ebe0'+(i===ult.length-1?';border:none':'')+'"><div><div style="font-size:13px;font-weight:700;color:#2C1810">'+c.produto+'</div><div style="font-size:11px;color:#8B7355">'+dataBr(c.data)+' · '+(c.forn||'-')+'</div></div><div style="display:flex;align-items:center;gap:8px"><span style="font-size:13px;font-weight:900;color:#ef4444">'+R$(c.qtd*c.vu)+'</span><button onclick="excluirCompra('+c.id+')" class="bp" style="background:none;border:none;cursor:pointer;color:#fca5a5;font-size:12px;padding:4px"><i class="fa-solid fa-xmark"></i></button></div></div>'}}
    abrirModal('Compras e Despesas',h);
}
function salvarCompra(e){e.preventDefault();var f=e.target;D.compras.push({id:D.nid.co++,data:f.data.value,tipo:f.tipo.value,produto:f.produto.value,qtd:parseInt(f.qtd.value),vu:parseFloat(f.vu.value),forn:f.forn.value||''});salvar();fecharTudo();toast('Compra registrada!');desenhar()}
function excluirCompra(id){if(!confirm('Remover?'))return;D.compras=D.compras.filter(function(x){return x.id!==id});salvar();toast('Removida!','aviso');fecharTudo();abrirCompras()}

// ============ PDF ============
function gerarPDF(){
    try{
        var jsPDF=window.jspdf.jsPDF;
        var doc=new jsPDF({unit:'mm',format:'a4'});
        doc.setFillColor(58,125,44);doc.rect(0,0,210,28,'F');
        doc.setTextColor(255,255,255);doc.setFontSize(18);doc.text('MiniFazenda - Relatorio',14,17);
        doc.setFontSize(9);doc.text('Gerado em: '+new Date().toLocaleDateString('pt-BR')+' as '+new Date().toLocaleTimeString('pt-BR'),14,24);
        doc.setTextColor(44,24,16);
        var y=36;var tv30=totalVendas(30),tc30=totalCompras(30),l30=tv30-tc30;
        doc.setFontSize(12);doc.setFont(undefined,'bold');doc.text('Resumo Financeiro (30 dias)',14,y);y+=7;
        doc.setFontSize(10);doc.setFont(undefined,'normal');doc.text('Receitas: '+R$(tv30),14,y);doc.text('Despesas: '+R$(tc30),100,y);y+=6;
        doc.setFont(undefined,'bold');doc.setTextColor(l30>=0?58:220,l30>=0?125:38,l30>=0?44:38);doc.text('Lucro: '+R$(l30),14,y);doc.setTextColor(44,24,16);y+=12;
        doc.setFontSize(12);doc.text('Rebanho',14,y);y+=7;doc.setFontSize(10);doc.setFont(undefined,'normal');
        doc.text('Galinhas: '+totalAves('g')+' aves ('+D.galinhas.length+' lotes)',14,y);y+=5;
        doc.text('Codornas: '+totalAves('c')+' aves ('+D.codornas.length+' lotes)',14,y);y+=5;
        doc.text('Peixes: '+totalAves('p')+' ('+D.peixes.length+' caixas)',14,y);y+=12;
        doc.setFontSize(12);doc.setFont(undefined,'bold');doc.text('Vendas (ultimas 25)',14,y);y+=3;
        var vRows=[];var ultV=D.vendas.slice(-25).reverse();
        for(var i=0;i<ultV.length;i++){var v=ultV[i];vRows.push([dataBr(v.data),v.produto,String(v.qtd),R$(v.vu),R$(v.qtd*v.vu),v.cliente])}
        doc.autoTable({startY:y,head:[['Data','Produto','Qtd','V.Unit.','Total','Cliente']],body:vRows,theme:'grid',headStyles:{fillColor:[58,125,44],textColor:255,fontSize:8,fontStyle:'bold'},bodyStyles:{fontSize:7.5},columnStyles:{0:{cellWidth:20},3:{cellWidth:20},4:{cellWidth:22,halign:'right'}},margin:{left:14,right:14}});
        y=doc.lastAutoTable.finalY+14;
        if(y<240){doc.setFontSize(12);doc.setFont(undefined,'bold');doc.text('Postura (ultimos 14 dias)',14,y);y+=3;var pRows=[];var ultP=D.postura.slice(-14);for(var i=0;i<ultP.length;i++){var p=ultP[i];pRows.push([dataBr(p.data),String(p.og),String(p.oc),String(p.og+p.oc)])}doc.autoTable({startY:y,head:[['Data','Ovos Galinha','Ovos Codorna','Total']],body:pRows,theme:'grid',headStyles:{fillColor:[212,160,48],textColor:255,fontSize:8,fontStyle:'bold'},bodyStyles:{fontSize:8},margin:{left:14,right:14}})}
        doc.save('minifazenda_relatorio_'+hoje()+'.pdf');
        toast('PDF baixado com sucesso!');
    }catch(erro){console.error('Erro PDF:',erro);toast('Erro ao gerar PDF','erro')}
}
