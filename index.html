<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="AgroPro">
  <meta name="description" content="Gestão financeira agrícola inteligente com IA">
  <title>AgroPro</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,900;1,9..40,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

  <script>
    /* ===== GERA ÍCONE PRÓPRIO VIA CANVAS (sem Google/CDN) ===== */
    function gerarIconePng(tamanho) {
      const c = document.createElement('canvas');
      c.width = c.height = tamanho;
      const ctx = c.getContext('2d');
      /* Fundo gradiente escuro premium */
      const g = ctx.createLinearGradient(0, 0, tamanho, tamanho);
      g.addColorStop(0, '#0a0e17');
      g.addColorStop(1, '#111827');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.roundRect(0, 0, tamanho, tamanho, tamanho * 0.22);
      ctx.fill();
      /* Brilho sutil no topo */
      const glow = ctx.createLinearGradient(0, 0, 0, tamanho * 0.5);
      glow.addColorStop(0, 'rgba(16,185,129,0.15)');
      glow.addColorStop(1, 'rgba(16,185,129,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.roundRect(0, 0, tamanho, tamanho, tamanho * 0.22);
      ctx.fill();
      /* Desenho estilizado de espiga de arroz */
      const cx = tamanho / 2, cy = tamanho / 2;
      const s = tamanho / 512;
      /* Haste */
      ctx.strokeStyle = '#d4a017';
      ctx.lineWidth = 6 * s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx, cy + 140 * s);
      ctx.quadraticCurveTo(cx - 10 * s, cy, cx + 5 * s, cy - 160 * s);
      ctx.stroke();
      /* Folha esquerda */
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.moveTo(cx - 8 * s, cy + 20 * s);
      ctx.quadraticCurveTo(cx - 80 * s, cy - 30 * s, cx - 60 * s, cy - 80 * s);
      ctx.quadraticCurveTo(cx - 30 * s, cy - 40 * s, cx - 8 * s, cy + 20 * s);
      ctx.fill();
      /* Folha direita */
      ctx.fillStyle = '#059669';
      ctx.beginPath();
      ctx.moveTo(cx + 10 * s, cy - 20 * s);
      ctx.quadraticCurveTo(cx + 70 * s, cy - 70 * s, cx + 55 * s, cy - 120 * s);
      ctx.quadraticCurveTo(cx + 30 * s, cy - 80 * s, cx + 10 * s, cy - 20 * s);
      ctx.fill();
      /* Grãos da espiga */
      const grãos = [
        [0, -130], [-18, -105], [18, -105], [-22, -78], [22, -78],
        [-18, -52], [18, -52], [-12, -28], [12, -28], [0, -8]
      ];
      ctx.fillStyle = '#d4a017';
      grãos.forEach(([ox, oy]) => {
        ctx.beginPath();
        ctx.ellipse(cx + ox * s, cy + oy * s, 14 * s, 20 * s, 0, 0, Math.PI * 2);
        ctx.fill();
      });
      /* Brilho nos grãos */
      ctx.fillStyle = 'rgba(255,223,100,0.4)';
      grãos.forEach(([ox, oy]) => {
        ctx.beginPath();
        ctx.ellipse(cx + ox * s - 3 * s, cy + oy * s - 6 * s, 5 * s, 8 * s, -0.3, 0, Math.PI * 2);
        ctx.fill();
      });
      /* Texto "AP" sutil */
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.font = `bold ${36 * s}px "DM Sans", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('AP', cx, cy + 195 * s);
      return c.toDataURL('image/png');
    }

    /* Monta manifest com ícones gerados */
    const icon192 = gerarIconePng(192);
    const icon512 = gerarIconePng(512);
    const manifest = {
      name: "AgroPro", short_name: "AgroPro", start_url: "./", display: "standalone",
      background_color: "#0a0e17", theme_color: "#0a0e17", orientation: "portrait",
      icons: [
        { src: icon192, sizes: "192x192", type: "image/png" },
        { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    const mBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const mLink = document.createElement('link');
    mLink.rel = 'manifest';
    mLink.href = URL.createObjectURL(mBlob);
    document.head.appendChild(mLink);

    /* Ícones normais da aba */
    const linkIcon = document.createElement('link');
    linkIcon.rel = 'icon'; linkIcon.type = 'image/png'; linkIcon.href = icon192;
    document.head.appendChild(linkIcon);
    const linkApple = document.createElement('link');
    linkApple.rel = 'apple-touch-icon'; linkApple.href = icon192;
    document.head.appendChild(linkApple);
  </script>

  <style>
    :root {
      --bg: #0a0e17;
      --bg-card: #111827;
      --bg-elevated: #1a2234;
      --bg-input: #0d1220;
      --border: rgba(255,255,255,0.06);
      --border-focus: #10b981;
      --fg: #f1f5f9;
      --fg-muted: #64748b;
      --fg-dim: #475569;
      --accent: #10b981;
      --accent-glow: rgba(16,185,129,0.25);
      --gold: #d4a017;
      --gold-soft: rgba(212,160,23,0.15);
      --danger: #ef4444;
      --danger-soft: rgba(239,68,68,0.12);
      --success-soft: rgba(16,185,129,0.12);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-lg: 24px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      --font: 'DM Sans', system-ui, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      position: fixed; top: 0; left: 0;
      display: grid; grid-template-rows: auto 1fr auto;
      background: var(--bg); color: var(--fg);
      font-family: var(--font);
    }

    /* ===== FUNDO ATMOSFÉRICO ===== */
    body::before {
      content: ''; position: fixed; top: -40%; left: -20%;
      width: 80vw; height: 80vw;
      background: radial-gradient(circle, rgba(16,185,129,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      animation: floatOrb 20s ease-in-out infinite alternate;
    }
    body::after {
      content: ''; position: fixed; bottom: -30%; right: -20%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(212,160,23,0.04) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      animation: floatOrb 15s ease-in-out infinite alternate-reverse;
    }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.1); }
    }

    /* ===== CABEÇALHOS ===== */
    .header {
      grid-row: 1; padding: 16px 20px;
      display: none; flex-direction: column; justify-content: center; z-index: 10;
      padding-top: max(16px, env(safe-area-inset-top));
      position: relative;
    }
    .header.active { display: flex; }
    .h-fin {
      background: linear-gradient(180deg, rgba(10,14,23,0.95) 0%, rgba(10,14,23,0.7) 100%);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .h-fin .top { display: flex; justify-content: space-between; align-items: center; }
    .h-fin .logo { display: flex; align-items: center; gap: 10px; }
    .h-fin .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #059669);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; box-shadow: 0 4px 12px var(--accent-glow);
    }
    .h-fin h1 {
      font-family: var(--font-display); font-size: 1.3rem; font-weight: 900;
      background: linear-gradient(135deg, var(--fg) 40%, var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .h-fin .bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 12px; }
    .saldo-label { font-size: 0.75rem; color: var(--fg-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .saldo-valor { font-size: 1.8rem; font-weight: 900; letter-spacing: -1px; margin-top: 2px; }
    .date { font-size: 0.8rem; color: var(--fg-dim); font-weight: 600; }
    .btn-pdf {
      background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--fg-muted); padding: 8px 16px; border-radius: 50px;
      font-size: 0.8rem; cursor: pointer; font-weight: 600;
      font-family: var(--font); transition: all 0.2s;
    }
    .btn-pdf:hover { background: var(--bg-card); color: var(--fg); border-color: rgba(255,255,255,0.12); }
    .btn-pdf:active { transform: scale(0.95); }

    .h-gen, .h-chat {
      background: linear-gradient(180deg, rgba(10,14,23,0.95) 0%, rgba(10,14,23,0.7) 100%);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      height: 60px; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 700; letter-spacing: -0.3px;
    }

    /* ===== CONTEÚDO ===== */
    .app-content {
      grid-row: 2; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
      position: relative; z-index: 1;
    }
    .app-content::-webkit-scrollbar { width: 0; }
    .screen { display: none; padding: 20px; padding-bottom: 30px; }
    .screen.active { display: block; animation: screenFade 0.35s ease; }
    @keyframes screenFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== CARDS RESUMO ===== */
    .resume-grid { display: flex; gap: 12px; margin-bottom: 28px; margin-top: -4px; }
    .resume-card {
      background: var(--bg-card); padding: 18px 16px; border-radius: var(--radius);
      border: 1px solid var(--border); flex: 1 1 0%; min-width: 0;
      position: relative; overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .resume-card:active { transform: scale(0.97); }
    .resume-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .resume-card.entrada::before { background: linear-gradient(90deg, var(--accent), #34d399); }
    .resume-card.saida::before { background: linear-gradient(90deg, var(--danger), #f87171); }
    .rc-label {
      font-size: 0.7rem; color: var(--fg-muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rc-value {
      font-size: 1.25rem; font-weight: 900; letter-spacing: -0.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rc-value.entrada { color: var(--accent); }
    .rc-value.saida { color: var(--danger); }

    .section-title {
      font-size: 1.05rem; font-weight: 700; margin-bottom: 16px;
      color: var(--fg); letter-spacing: -0.3px;
    }

    /* ===== FAB ===== */
    .btn-add {
      width: 56px; height: 56px; border-radius: 50%; border: none; color: white;
      background: linear-gradient(135deg, var(--accent), #059669);
      font-size: 1.8rem; font-weight: 300;
      box-shadow: 0 8px 24px var(--accent-glow), 0 0 0 0 var(--accent-glow);
      position: fixed; bottom: 84px; right: 20px; z-index: 20; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s; line-height: 1;
    }
    .btn-add:hover { transform: scale(1.08); box-shadow: 0 12px 32px var(--accent-glow); }
    .btn-add:active { transform: scale(0.92); }

    /* ===== LISTA EXTRATO ===== */
    .extrato-list { display: flex; flex-direction: column; gap: 8px; }
    .extrato-item {
      background: var(--bg-card); padding: 14px 16px; border-radius: var(--radius);
      border: 1px solid var(--border); display: flex; align-items: center;
      transition: transform 0.15s, border-color 0.2s;
    }
    .extrato-item:active { transform: scale(0.98); border-color: rgba(255,255,255,0.1); }
    .ei-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .ei-icon {
      width: 42px; height: 42px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0;
      background: var(--bg-elevated); border: 1px solid var(--border);
    }
    .ei-info { flex: 1; min-width: 0; }
    .ei-info h4 {
      font-size: 0.92rem; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg);
    }
    .ei-info p {
      font-size: 0.8rem; color: var(--fg-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
    }
    .ei-right { text-align: right; flex-shrink: 0; margin-left: 10px; }
    .ei-value { font-size: 0.95rem; font-weight: 800; letter-spacing: -0.3px; }
    .ei-value.in { color: var(--accent); }
    .ei-value.out { color: var(--danger); }
    .ei-date { font-size: 0.7rem; color: var(--fg-dim); margin-top: 2px; }
    .ei-actions { display: flex; gap: 0; margin-left: 6px; flex-shrink: 0; }
    .btn-icon {
      background: none; border: none; font-size: 0.95rem; cursor: pointer;
      padding: 6px; border-radius: 8px; transition: background 0.15s;
    }
    .btn-icon:hover { background: var(--bg-elevated); }
    .btn-icon:active { transform: scale(0.85); }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 50; display: none; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-sheet {
      background: var(--bg-card); width: 100%; max-height: 90vh;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 12px 24px 32px; transform: translateY(100%);
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      overflow-y: auto; border-top: 1px solid var(--border);
    }
    @keyframes slideUp { to { transform: translateY(0); } }
    .modal-handle {
      width: 40px; height: 4px; background: rgba(255,255,255,0.15);
      border-radius: 2px; margin: 0 auto 20px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 0.72rem; font-weight: 700;
      margin-bottom: 8px; color: var(--fg-muted);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .form-control {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 16px;
      background: var(--bg-input); outline: none; color: var(--fg);
      font-family: var(--font); transition: border-color 0.2s, background 0.2s;
      -webkit-appearance: none; appearance: none;
    }
    .form-control:focus { border-color: var(--border-focus); background: var(--bg-elevated); }
    .form-control option { background: var(--bg-card); color: var(--fg); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .type-btn {
      padding: 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg-input); text-align: center; font-weight: 700;
      cursor: pointer; font-size: 0.95rem; font-family: var(--font);
      transition: all 0.2s;
    }
    .type-btn:active { transform: scale(0.96); }
    .type-btn.selected-in { border-color: var(--accent); background: var(--success-soft); color: var(--accent); }
    .type-btn.selected-out { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
    .total-preview-box {
      background: linear-gradient(135deg, var(--bg-elevated), var(--bg-input));
      padding: 18px; border-radius: var(--radius-sm); text-align: center;
      color: var(--fg); margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .total-preview-box label { font-size: 0.7rem; opacity: 0.5; text-transform: uppercase; letter-spacing: 1.5px; }
    .total-preview-box span { font-size: 1.6rem; font-weight: 900; display: block; margin-top: 6px; letter-spacing: -1px; }
    .btn-submit-modal {
      width: 100%; padding: 16px; border: none; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), #059669);
      color: white; font-size: 1rem; font-weight: 700; cursor: pointer;
      font-family: var(--font); transition: all 0.2s;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .btn-submit-modal:active { transform: scale(0.97); }

    /* ===== GUIA ===== */
    .guia-grid { display: flex; flex-direction: column; gap: 10px; }
    .guia-card {
      background: var(--bg-card); border-radius: var(--radius);
      border: 1px solid var(--border); display: flex; overflow: hidden;
      cursor: pointer; transition: all 0.2s;
    }
    .guia-card:active { transform: scale(0.98); border-color: rgba(255,255,255,0.12); }
    .guia-color { width: 4px; flex-shrink: 0; }
    .guia-content { padding: 16px 18px; flex: 1; display: flex; justify-content: space-between; align-items: center; }
    .gc-text h3 { font-size: 0.95rem; color: var(--fg); margin-bottom: 4px; font-weight: 700; }
    .gc-text p { font-size: 0.8rem; color: var(--fg-muted); }
    .gc-arrow { color: var(--fg-dim); font-size: 1.2rem; transition: transform 0.2s; }
    .guia-card:hover .gc-arrow { transform: translateX(3px); }

    /* ===== COMPRAS ===== */
    .compras-list { display: flex; flex-direction: column; gap: 14px; }
    .compra-item {
      background: var(--bg-card); border-radius: var(--radius);
      overflow: hidden; border: 1px solid var(--border);
    }
    .compra-header {
      background: var(--bg-elevated); padding: 12px 18px;
      font-size: 0.75rem; font-weight: 700; color: var(--fg-muted);
      text-transform: uppercase; letter-spacing: 1.2px;
      border-bottom: 1px solid var(--border);
    }
    .compra-linha {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.9rem;
    }
    .compra-linha:last-child { border-bottom: none; }
    .compra-linha small { color: var(--fg-dim); }

    /* ===== CHAT ===== */
    .chat-hidden { display: none !important; }
    #chat-container {
      display: flex; flex-direction: column; height: 100%;
      background: var(--bg); border-radius: 0; overflow: hidden;
    }
    #chat-messages {
      flex: 1; padding: 16px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
    }
    #chat-messages::-webkit-scrollbar { width: 0; }
    .msg {
      max-width: 88%; padding: 12px 16px; font-size: 0.95rem;
      line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
    }
    .msg-user {
      background: linear-gradient(135deg, var(--accent), #059669);
      color: white; align-self: flex-end;
      border-radius: 18px 18px 4px 18px;
    }
    .msg-bot {
      background: var(--bg-card); color: var(--fg);
      align-self: flex-start; border-radius: 18px 18px 18px 4px;
      border: 1px solid var(--border);
      animation: msgPop 0.3s ease;
    }
    @keyframes msgPop { from { opacity: 0; transform: translateY(10px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .chat-input-area {
      display: flex; padding: 12px 16px; background: var(--bg-card);
      border-top: 1px solid var(--border); gap: 10px; align-items: center;
      padding-bottom: max(12px, en
