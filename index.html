<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef1f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AgroPro">
<meta name="description" content="Gerenciamento financeiro para avicultura">
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleIcon">
<title>AgroPro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5;--bg-card:#fff;--bg-el:#f4f6f9;--bg-inp:#f8f9fb;
  --bdr:#e2e6ec;--bdr-f:#22c55e;--fg:#1a1d23;--fg-m:#6b7280;--fg-d:#9ca3af;
  --ac:#22c55e;--ac2:#16a34a;--ac-g:rgba(34,197,94,.18);
  --gold:#d97706;--gold-s:rgba(217,119,6,.1);
  --dng:#ef4444;--dng-s:rgba(239,68,68,.08);
  --suc-s:rgba(34,197,94,.08);
  --r:16px;--rs:10px;--rl:24px;
  --f:'DM Sans',system-ui,sans-serif;--fd:'Playfair Display',Georgia,serif;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(0,0,0,.07);
  --sh-lg:0 10px 30px rgba(0,0,0,.1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;top:0;left:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);color:var(--fg);font-family:var(--f)}
.header{grid-row:1;padding:12px 16px;display:none;flex-direction:column;z-index:10;padding-top:max(12px,env(safe-area-inset-top));background:var(--bg);position:relative}
.header.active{display:flex}
.h-fin .top{display:flex;justify-content:space-between;align-items:center}
.h-fin .logo{display:flex;align-items:center;gap:8px}
.h-fin .logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:.78rem;font-weight:700;box-shadow:0 2px 8px var(--ac-g)}
.h-fin h1{font-family:var(--fd);font-size:1.15rem;font-weight:900;color:var(--fg)}
.h-fin .bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
.saldo-label{font-size:.62rem;color:var(--fg-m);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.saldo-valor{font-size:1.5rem;font-weight:900;letter-spacing:-1px;margin-top:1px;color:var(--fg)}
.date{font-size:.72rem;color:var(--fg-d);font-weight:500}
.btn-pdf{background:var(--bg-el);border:1px solid var(--bdr);color:var(--fg-m);padding:6px 14px;border-radius:50px;font-size:.7rem;cursor:pointer;font-weight:600;font-family:var(--f);transition:all .2s;white-space:nowrap}
.btn-pdf:active{transform:scale(.95);background:var(--bdr)}
.h-gen{height:54px;align-items:center;justify-content:center;font-size:1rem;font-weight:700;background:var(--bg);border-bottom:1px solid var(--bdr)}
.app-content{grid-row:2;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.app-content::-webkit-scrollbar{width:0}
.screen{display:none;padding:14px 14px 90px}
.screen.active{display:block;animation:sf .3s ease}
@keyframes sf{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.dash-saldo{background:linear-gradient(135deg,#1a1d23 0%,#2d3139 100%);border-radius:var(--r);padding:20px 18px;margin-bottom:14px;position:relative;overflow:hidden;color:#fff}
.dash-saldo::before{content:'';position:absolute;top:-50px;right:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(34,197,94,.15),transparent 70%);pointer-events:none}
.ds-label{font-size:.62rem;color:rgba(255,255,255,.5);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;position:relative;z-index:1}
.ds-valor{font-size:1.7rem;font-weight:900;letter-spacing:-1px;margin-top:3px;position:relative;z-index:1}
.ds-valor.pos{color:#4ade80}.ds-valor.neg{color:#f87171}.ds-valor.zero{color:rgba(255,255,255,.7)}
.ds-meta{display:flex;gap:14px;margin-top:10px;position:relative;z-index:1}
.ds-meta-item{display:flex;align-items:center;gap:5px;font-size:.7rem;font-weight:600;color:rgba(255,255,255,.55)}
.ds-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ds-dot.g{background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,.5)}
.ds-dot.r{background:#f87171;box-shadow:0 0 6px rgba(248,113,113,.5)}
.kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.kpi-card{background:var(--bg-card);padding:14px 8px;border-radius:14px;border:1px solid var(--bdr);text-align:center;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.kpi-card:active{transform:scale(.97)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px}
.kpi-card.k-ent::before{background:linear-gradient(90deg,var(--ac),#4ade80)}
.kpi-card.k-sai::before{background:linear-gradient(90deg,var(--dng),#f87171)}
.kpi-card.k-lan::before{background:linear-gradient(90deg,var(--gold),#fbbf24)}
.kpi-icon{font-size:1.2rem;margin-bottom:5px;display:block}
.kpi-label{font-size:.56rem;color:var(--fg-d);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.kpi-value{font-size:.88rem;font-weight:900;letter-spacing:-.3px}
.kpi-value.v-ent{color:var(--ac2)}.kpi-value.v-sai{color:var(--dng)}.kpi-value.v-lan{color:var(--gold)}
.dash-chart{background:var(--bg-card);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh);overflow:hidden}
.dash-chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dash-chart-head h3{font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--fg)}
.dash-chart-head h3::before{content:'';width:3px;height:14px;background:linear-gradient(180deg,var(--ac),var(--ac2));border-radius:2px}
.chart-legend{display:flex;gap:12px}
.chart-legend-item{display:flex;align-items:center;gap:4px;font-size:.6rem;color:var(--fg-d);font-weight:600}
.chart-legend-dot{width:8px;height:8px;border-radius:2px}
.chart-bars{display:flex;align-items:flex-end;gap:5px;height:100px;padding-top:6px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart-bar-pair{display:flex;gap:2px;align-items:flex-end;width:100%;height:100%;justify-content:center}
.chart-bar{width:38%;min-height:2px;border-radius:3px 3px 1px 1px;transition:height .6s cubic-bezier(.16,1,.3,1)}
.chart-bar.bar-ent{background:linear-gradient(180deg,#22c55e,rgba(34,197,94,.3))}
.chart-bar.bar-sai{background:linear-gradient(180deg,#ef4444,rgba(239,68,68,.3))}
.chart-day{font-size:.55rem;color:var(--fg-d);font-weight:600}
.section-title{font-size:.95rem;font-weight:700;margin-bottom:12px;letter-spacing:-.2px;display:flex;align-items:center;gap:7px;color:var(--fg)}
.section-title::before{content:'';width:3px;height:15px;background:linear-gradient(180deg,var(--ac),var(--ac2));border-radius:2px}
.st-count{font-size:.65rem;color:var(--fg-d);font-weight:600;margin-left:auto;background:var(--bg-el);padding:2px 10px;border-radius:50px;border:1px solid var(--bdr)}
.timeline-list{position:relative;padding-left:18px}
.timeline-list::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:1.5px;background:linear-gradient(180deg,var(--ac),var(--bdr),transparent)}
.timeline-item{position:relative;margin-bottom:8px;animation:isl .3s ease backwards}
.timeline-item::before{content:'';position:absolute;left:-18px;top:15px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);z-index:1}
.timeline-item.ti-in::before{background:var(--ac);box-shadow:0 0 8px var(--ac-g)}
.timeline-item.ti-out::before{background:var(--dng);box-shadow:0 0 8px rgba(239,68,68,.25)}
.timeline-card{background:var(--bg-card);padding:12px 14px;border-radius:12px;border:1px solid var(--bdr);display:flex;align-items:center;gap:10px;box-shadow:var(--sh);transition:transform .15s}
.timeline-card:active{transform:scale(.98)}
.tc-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.tc-icon.ic-in{background:var(--suc-s);border:1px solid rgba(34,197,94,.12)}
.tc-icon.ic-out{background:var(--dng-s);border:1px solid rgba(239,68,68,.12)}
.tc-body{flex:1;min-width:0}
.tc-body h4{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-body p{font-size:.66rem;color:var(--fg-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tc-right{text-align:right;flex-shrink:0}
.tc-value{font-size:.85rem;font-weight:800;letter-spacing:-.2px}
.tc-value.in{color:var(--ac2)}.tc-value.out{color:var(--dng)}
.tc-date{font-size:.56rem;color:var(--fg-d);font-weight:600;background:var(--bg-el);padding:1px 6px;border-radius:4px;margin-top:2px;display:inline-block}
.tc-actions{display:flex;flex-shrink:0;margin-left:2px}
.btn-icon{background:none;border:none;font-size:.82rem;cursor:pointer;padding:4px;border-radius:8px;transition:background .15s;color:var(--fg-d)}
.btn-icon:active{transform:scale(.85)}
.empty-state{text-align:center;padding:40px 20px;color:var(--fg-d)}
.empty-state .es-icon{font-size:2.5rem;margin-bottom:10px;opacity:.5}
.empty-state p{font-size:.82rem;font-weight:500;line-height:1.5}
.empty-state small{font-size:.72rem;display:block;margin-top:6px;opacity:.7}
.resume-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.resume-card{background:var(--bg-card);padding:14px 12px;border-radius:12px;border:1px solid var(--bdr);box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.resume-card:active{transform:scale(.97)}
.resume-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.resume-card.entrada::before{background:linear-gradient(90deg,var(--ac),#4ade80)}
.resume-card.saida::before{background:linear-gradient(90deg,var(--dng),#f87171)}
.rc-label{font-size:.6rem;color:var(--fg-m);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.rc-value{font-size:1rem;font-weight:900;letter-spacing:-.4px}
.rc-value.entrada{color:var(--ac2)}.rc-value.saida{color:var(--dng)}
.extrato-list{display:flex;flex-direction:column;gap:6px}
.extrato-item{background:var(--bg-card);padding:10px 12px;border-radius:var(--rs);border:1px solid var(--bdr);display:flex;align-items:center;box-shadow:var(--sh);transition:transform .15s;gap:8px}
.extrato-item:active{transform:scale(.98)}
.ei-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.ei-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.ei-icon.ic-in{background:var(--suc-s)}.ei-icon.ic-out{background:var(--dng-s)}
.ei-info{flex:1;min-width:0}
.ei-info h4{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ei-info p{font-size:.66rem;color:var(--fg-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ei-right{text-align:right;flex-shrink:0}
.ei-value{font-size:.82rem;font-weight:800}
.ei-value.in{color:var(--ac2)}.ei-value.out{color:var(--dng)}
.ei-date{font-size:.58rem;color:var(--fg-d);margin-top:1px}
.ei-actions{display:flex;flex-shrink:0}
.btn-add{width:52px;height:52px;border-radius:50%;border:none;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));font-size:1.6rem;font-weight:300;box-shadow:0 6px 20px var(--ac-g),0 2px 8px rgba(0,0,0,.1);position:fixed;bottom:78px;right:14px;z-index:20;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;line-height:1}
.btn-add:active{transform:scale(.9)}
.btn-add.hide{display:none}
.nav-bar{grid-row:3;display:flex;background:var(--bg-card);border-top:1px solid var(--bdr);padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:10;box-shadow:0 -2px 10px rgba(0,0,0,.04)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;border:none;background:none;font-family:var(--f);transition:all .2s;position:relative;border-radius:10px}
.nav-item .ni-icon{font-size:1.2rem;transition:transform .2s}
.nav-item .ni-label{font-size:.58rem;font-weight:600;color:var(--fg-d);transition:color .2s}
.nav-item.active .ni-icon{transform:scale(1.1)}
.nav-item.active .ni-label{color:var(--ac);font-weight:700}
.nav-item.active::after{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:20px;height:3px;background:var(--ac);border-radius:0 0 3px 3px}
.nav-item:active .ni-icon{transform:scale(.9)}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal-sheet{background:var(--bg-card);width:100%;max-height:88vh;border-radius:var(--rl) var(--rl) 0 0;padding:10px 18px 28px;transform:translateY(100%);animation:su .3s cubic-bezier(.16,1,.3,1) forwards;overflow-y:auto;border-top:1px solid var(--bdr);box-shadow:var(--sh-lg)}
@keyframes su{to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--bdr);border-radius:2px;margin:0 auto 10px}
.modal-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-title-row h3{font-size:1.05rem;font-weight:800}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.65rem;font-weight:700;margin-bottom:5px;color:var(--fg-m);text-transform:uppercase;letter-spacing:1px}
.form-control{width:100%;padding:11px 12px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:15px;background:var(--bg-inp);outline:none;color:var(--fg);font-family:var(--f);transition:border-color .2s;-webkit-appearance:none;appearance:none}
.form-control:focus{border-color:var(--bdr-f);background:var(--bg-el);box-shadow:0 0 0 3px var(--ac-g)}
.form-control option{background:var(--bg-card);color:var(--fg)}
.form-control optgroup{background:var(--bg-el);color:var(--fg-m);font-weight:700;font-style:normal}
.form-control optgroup option{background:var(--bg-card);color:var(--fg);font-weight:400}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.type-btn{padding:11px;border:1.5px solid var(--bdr);border-radius:var(--rs);background:var(--bg-inp);text-align:center;font-weight:700;cursor:pointer;font-size:.88rem;font-family:var(--f);transition:all .2s;color:var(--fg-m)}
.type-btn:active{transform:scale(.96)}
.type-btn.sel-in{border-color:var(--ac);background:var(--suc-s);color:var(--ac2)}
.type-btn.sel-out{border-color:var(--dng);background:var(--dng-s);color:var(--dng)}
.tp-box{background:var(--bg-el);padding:14px;border-radius:var(--rs);text-align:center;margin-bottom:14px;border:1px solid var(--bdr)}
.tp-box label{font-size:.62rem;color:var(--fg-d);text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
.tp-box span{font-size:1.35rem;font-weight:900;display:block;margin-top:4px;letter-spacing:-.8px;color:var(--fg)}
.btn-sbm{width:100%;padding:13px;border:none;border-radius:var(--rs);background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:.92rem;font-weight:700;cursor:pointer;font-family:var(--f);transition:all .2s;box-shadow:0 4px 12px var(--ac-g)}
.btn-sbm:active{transform:scale(.97)}
.btn-del{width:100%;padding:11px;border:1.5px solid rgba(239,68,68,.2);border-radius:var(--rs);background:var(--dng-s);color:var(--dng);font-size:.88rem;font-weight:700;cursor:pointer;font-family:var(--f);margin-top:8px;transition:all .2s}
.btn-del:active{transform:scale(.97)}
.guia-grid{display:flex;flex-direction:column;gap:8px}
.guia-card{background:var(--bg-card);border-radius:var(--r);border:1px solid var(--bdr);display:flex;overflow:hidden;cursor:pointer;box-shadow:var(--sh);transition:all .15s}
.guia-card:active{transform:scale(.98)}
.guia-color{width:4px;flex-shrink:0}
.guia-content{padding:14px 16px;flex:1;display:flex;justify-content:space-between;align-items:center}
.gc-text h3{font-size:.88rem;margin-bottom:3px;font-weight:700}
.gc-text p{font-size:.74rem;color:var(--fg-m);line-height:1.4}
.gc-arrow{color:var(--fg-d);font-size:1rem}
.compras-list{display:flex;flex-direction:column;gap:10px}
.compra-item{background:var(--bg-card);border-radius:var(--r);overflow:hidden;border:1px solid var(--bdr);box-shadow:var(--sh)}
.compra-header{background:var(--bg-el);padding:10px 14px;font-size:.68rem;font-weight:700;color:var(--fg-m);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center}
.compra-linha{padding:11px 14px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;font-size:.82rem;gap:6px}
.compra-linha:last-child{border-bottom:none}
.compra-linha small{color:var(--fg-d)}
.lotes-grid{display:flex;flex-direction:column;gap:8px}
.lote-card{background:var(--bg-card);border-radius:var(--r);border:1px solid var(--bdr);padding:14px 16px;box-shadow:var(--sh);transition:transform .15s}
.lote-card:active{transform:scale(.98)}
.lc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.lc-top h4{font-size:.88rem;font-weight:700}
.lc-badge{font-size:.6rem;font-weight:700;padding:3px 8px;border-radius:50px;text-transform:uppercase;letter-spacing:.5px}
.lc-badge.ativo{background:var(--suc-s);color:var(--ac2);border:1px solid rgba(34,197,94,.15)}
.lc-badge.finalizado{background:var(--gold-s);color:var(--gold);border:1px solid rgba(217,119,6,.15)}
.lc-detail{font-size:.74rem;color:var(--fg-m);line-height:1.6}
.lc-detail strong{color:var(--fg);font-weight:600}
.lc-actions{display:flex;gap:6px;margin-top:10px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#1a1d23;color:#fff;padding:10px 20px;border-radius:50px;font-size:.78rem;font-weight:600;z-index:100;transition:transform .3s cubic-bezier(.16,1,.3,1);box-shadow:var(--sh-lg);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.t-ok{background:linear-gradient(135deg,#16a34a,#15803d)}
.toast.t-err{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.toast.t-info{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
.gestao-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gestao-card{background:var(--bg-card);border:1px solid var(--bdr);border-radius:var(--r);padding:20px 14px;text-align:center;box-shadow:var(--sh);cursor:pointer;transition:all .15s}
.gestao-card:active{transform:scale(.96)}
.gestao-card .gc-emoji{font-size:2rem;margin-bottom:8px;display:block}
.gestao-card h3{font-size:.85rem;font-weight:700;margin-bottom:3px}
.gestao-card p{font-size:.68rem;color:var(--fg-m)}
.modal-section{margin-bottom:14px}
.modal-section h4{font-size:.82rem;font-weight:700;margin-bottom:8px;color:var(--fg)}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bdr);font-size:.82rem}
.info-row:last-child{border-bottom:none}
.info-row .ir-label{color:var(--fg-m);font-weight:500}
.info-row .ir-value{font-weight:700;text-align:right;max-width:55%;word-break:break-word}
